[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-repro"
version = "0.1.0"
description = "Self-Correcting Scientific Experiment Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "PyMuPDF>=1.24.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    # Phase 4: ML experiment environment
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
research-repro = "research_repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
