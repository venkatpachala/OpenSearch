# 10 evaluation goals covering distinct agent behaviors.
# Each goal is executable by the current MNIST image-classification environment.

goals:
  - id: G01
    description: "Accuracy under a hard latency constraint"
    objective: "Find a configuration for the existing MNIST image-classification experiment that achieves the highest possible test accuracy while keeping latency below 100 ms. Start from the default configuration."
    primary_metric: accuracy
    target_value: 0.95
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.95, tolerance: 0.0, minimum: 0.95}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 6, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {}

  - id: G02
    description: "Latency optimization while preserving accuracy"
    objective: "Reduce MNIST computational-cost latency below 100 ms while keeping accuracy at least 0.93. Start from the default configuration."
    primary_metric: accuracy
    target_value: 0.93
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.93, tolerance: 0.0, minimum: 0.93}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {}

  - id: G03
    description: "Maximize accuracy under a smaller architecture"
    objective: "Maximize MNIST test accuracy using a lower-complexity model while keeping latency below 100 ms."
    primary_metric: accuracy
    target_value: 0.94
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.94, tolerance: 0.0, minimum: 0.94}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {hidden_size: 64, hidden_layers: 1}
    faults: {}

  - id: G04
    description: "Normalization ablation-style experiment"
    objective: "Investigate whether enabling input normalization improves MNIST accuracy to at least 0.95 while keeping latency below 100 ms."
    primary_metric: accuracy
    target_value: 0.95
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.95, tolerance: 0.0, minimum: 0.95}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {hidden_size: 64, hidden_layers: 1, normalize: false}
    faults: {}

  - id: G05
    description: "Parameter efficiency via dimensionality reduction"
    objective: "Find a MNIST configuration that reaches accuracy at least 0.90 with latency below 100 ms, considering dimensionality reduction if useful."
    primary_metric: accuracy
    target_value: 0.90
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.90, tolerance: 0.0, minimum: 0.90}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {pca_components: 64}
    faults: {}

  - id: G06
    description: "Training-budget tradeoff"
    objective: "Reach MNIST accuracy at least 0.92 with latency below 100 ms under a reduced training iteration budget."
    primary_metric: accuracy
    target_value: 0.92
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.92, tolerance: 0.0, minimum: 0.92}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {max_iter: 40}
    faults: {}

  - id: G07
    description: "Injected timeout recovery"
    objective: "Find a MNIST configuration with accuracy at least 0.90 and latency below 100 ms after recovering from an injected timeout on the first experiment."
    primary_metric: accuracy
    target_value: 0.90
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.90, tolerance: 0.0, minimum: 0.90}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {"1": timeout}

  - id: G08
    description: "Injected tool crash / fail-once recovery"
    objective: "Reach MNIST accuracy at least 0.90 with latency below 100 ms after recovering from an injected first-call tool crash."
    primary_metric: accuracy
    target_value: 0.90
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.90, tolerance: 0.0, minimum: 0.90}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {"1": fail_once}

  - id: G09
    description: "Result inconsistency / corrupted metric recovery"
    objective: "Detect a corrupted training metric and still reach MNIST accuracy at least 0.90 with latency below 100 ms."
    primary_metric: accuracy
    target_value: 0.90
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.90, tolerance: 0.0, minimum: 0.90}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {"1": corrupt_metric}

  - id: G10
    description: "Goal-drift / regression under injected illegal high-accuracy result"
    objective: "Ignore an illegally high-accuracy high-latency injected result and find a legal MNIST configuration with accuracy at least 0.90 and latency below 100 ms."
    primary_metric: accuracy
    target_value: 0.90
    success_threshold: 0.0
    criterion: {metric: accuracy, direction: maximize, target: 0.90, tolerance: 0.0, minimum: 0.90}
    constraints: ["latency_under_100ms"]
    budget: {max_experiments: 5, max_total_recoveries: 6, max_recoveries_per_subtask: 3}
    seed: 42
    initial_configuration: {}
    faults: {"1": wrong_result}
